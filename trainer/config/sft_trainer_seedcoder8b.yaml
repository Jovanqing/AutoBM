# =============================================================
# SFT Training Config for AutoBM Task
# Model: Seed-Coder-8B (or any HuggingFace causal LM)
# Hardware: 4 GPUs, single node, FSDP
# =============================================================
# Usage:
#   python -m torch.distributed.run --nproc_per_node=4 --nnodes=1 \
#     -m verl.trainer.fsdp_sft_trainer \
#     --config-path ./trainer/config/ \
#     --config-name sft_trainer_seedcoder8b \
#     trainer.n_gpus_per_node=4 trainer.nnodes=1
# =============================================================

defaults:
  - optim: fsdp
  - _self_

data:
  train_batch_size: 256
  micro_batch_size_per_gpu: 4
  # -- Point these to your CivilInstruct SFT parquet files --
  train_files: ./data_example/data_AutoBM_sample/Data_SFT/train.parquet
  val_files: ./data_example/data_AutoBM_sample/Data_SFT/val.parquet
  train_max_samples: -1
  val_max_samples: -1
  prompt_key: question
  response_key: answer
  prompt_dict_keys: null
  response_dict_keys: null
  multiturn:
    enable: false
    messages_key: messages
    tools_key: tools
    enable_thinking_key: enable_thinking
  max_length: 8192
  truncation: error
  balance_dp_token: False
  chat_template: null
  custom_cls:
    path: null
    name: null
  use_shm: False
  apply_chat_template_kwargs: {}

model:
  # -- Replace with your local model path or HuggingFace model ID --
  partial_pretrain: Seed-Coder-8B-Reasoning
  use_shm: False
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: False
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: False
  strategy: fsdp2

optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  lr_warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine

ulysses_sequence_parallel_size: 1
use_remove_padding: False

trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
  project_name: AutoBM-SFT
  experiment_name: seedcoder8b-civilinstruct
  total_epochs: 4
  total_training_steps: null
  logger: ['console', 'swanlab']
  seed: 42
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 4
  max_ckpt_to_keep: 3
  resume_mode: auto
  resume_from_path: null
  checkpoint:
    save_contents: ["model", "optimizer", "extra"]
    load_contents: ${trainer.checkpoint.save_contents}
  device: cuda
